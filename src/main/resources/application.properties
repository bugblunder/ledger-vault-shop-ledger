spring.application.name=LedgerVault
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgervault}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Generate outside the application; there is deliberately no default signing key.
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}

# Enable only for first-time setup; existing users are never silently promoted.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Comma-separated browser origins. Empty denies cross-origin browser access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.khatavision.backend.controller
logging.level.org.springframework.security=INFO
server.error.include-message=never
server.error.include-stacktrace=never
