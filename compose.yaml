services:
  db:
    image: mysql:8.4.13
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/init_env.py}
      MYSQL_DATABASE: ledgervault
      MYSQL_USER: ledger_migrator
      MYSQL_PASSWORD: ${MIGRATION_DB_PASSWORD:?Run python scripts/init_env.py}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Run python scripts/init_env.py}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-app-user.sh:/docker-entrypoint-initdb.d/20-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
  migrate:
    build: .
    image: ledgervault-local
    entrypoint: ["java", "-Dloader.main=com.khatavision.backend.MigrationApplication", "-cp", "/app/ledgervault.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    healthcheck:
      disable: true
    environment:
      DB_URL: jdbc:mysql://db:3306/ledgervault?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ledger_migrator
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Run python scripts/init_env.py}
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: ledgervault-local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/ledgervault?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ledger_app
      DB_PASSWORD: ${DB_PASSWORD:?Run python scripts/init_env.py}
      SPRING_FLYWAY_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Run python scripts/init_env.py}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  mysql_data:
